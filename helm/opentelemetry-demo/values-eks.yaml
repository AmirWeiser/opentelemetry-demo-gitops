# EKS-specific overrides, layered on top of values.yaml:
#   helm ... -f values.yaml -f values-eks.yaml
# ArgoCD wires this up automatically via argocd-application-eks.yaml, which
# lists both files under spec.source.helm.valueFiles - apply that manifest
# instead of argocd-application.yaml when targeting EKS.
#
# Kept separate from values.yaml (rather than just flipping settings in
# place) because these two settings are only ever wrong on one environment
# or the other, never both: minikube has no ALB controller and no
# ghcr-pull-secret, so values.yaml's own defaults stay minikube-safe.

global:
  imagePullSecrets:
    - name: ghcr-pull-secret

frontendProxy:
  ingress:
    enabled: true
