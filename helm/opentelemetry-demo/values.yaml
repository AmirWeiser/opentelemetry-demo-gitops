frontendProxy:
  replicaCount: 1
  image:
    repository: ghcr.io/amirweiser/frontend-proxy
    tag: e4ad98c3c8bc692ea832d94f6365e9bfc45938f8
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    # limits.cpu was 150m, which pegged the container at 100% of its quota
    # even at idle (same hard-CFS-throttle failure mode as the Grafana fix
    # below) and manifested as the UI hanging with "upstream request
    # timeout" - envoy's proxying + OTel tracing overhead needs more burst
    # room than that. memory.limit bumped too: usage was already sitting
    # right at the old 50Mi ceiling.
    limits:
      cpu: 500m
      memory: 128Mi
  ingress:
    # Minikube-safe default: ALB ingress class has no controller there, and
    # ArgoCD would report the Application stuck Progressing forever waiting
    # for an address that never comes. EKS overrides this to true in
    # values-eks.yaml.
    enabled: false
