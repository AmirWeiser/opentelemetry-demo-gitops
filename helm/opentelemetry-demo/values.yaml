# -----------------------------------------------------------------------------
# Minimum observability stack. Every service above already pushes OTLP
# traces/metrics/logs to OTEL_EXPORTER_OTLP_ENDPOINT -
# http://opentelemetry-demo-otelcol:4317 - this just deploys the collector
# that's been missing (that's why every pod's logs are full of export
# failures) and a minimal backend to look at what it collects. All
# single-replica, minimal footprint given this cluster's resource ceiling.
# -----------------------------------------------------------------------------
otelCollector:
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
# In-memory storage (no external DB), built-in OTLP receiver.
jaeger:
  replicaCount: 1
  image:
    repository: jaegertracing/all-in-one
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
prometheus:
  replicaCount: 1
  image:
    repository: prom/prometheus
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 300Mi
grafana:
  replicaCount: 1
  image:
    repository: grafana/grafana
    # Pinned to an older, lighter release on purpose: "latest" pulls a much
    # heavier build (its own internal apiserver, unified storage, alerting
    # scheduler) that hammers its SQLite backend hard enough to time out
    # under this cluster's CPU constraints.
    tag: 10.4.2
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    # limits.cpu is deliberately generous: a CPU *limit* is a hard CFS
    # throttle regardless of node headroom (unlike requests, which only
    # affect scheduling fairness). Grafana's first-boot SQLite migration
    # burst needs real CPU briefly - a tight limit here made startup take
    # 20x+ longer than an unconstrained run of the same image measured
    # locally (99s unconstrained vs never completing within 5min at 200m).
    limits:
      cpu: 1000m
      memory: 350Mi
  adminPassword: admin
