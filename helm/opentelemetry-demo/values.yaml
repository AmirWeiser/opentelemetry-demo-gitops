# -----------------------------------------------------------------------------
# Global settings shared across all services
# -----------------------------------------------------------------------------
global:
  # imagePullSecrets:
  #   - name: ghcr-pull-secret
  imagePullSecrets: []

# -----------------------------------------------------------------------------
# Per-service settings.
# Only what actually varies between deploys lives here: image, replica count,
# and resources. Everything else (env wiring, ports, probes, security
# context) is stable and stays hardcoded in the templates.
#
# Some services below temporarily point at the public upstream
# ghcr.io/open-telemetry/demo image (same source project, pre-built) because
# our own CI hasn't built/pushed them yet. Once the pipeline builds them from
# demo-src, these switch to ghcr.io/amirweiser/<service> tagged by commit sha,
# same as the services that are already self-built.
# -----------------------------------------------------------------------------

accounting:
  replicaCount: 1
  image:
    repository: ghcr.io/open-telemetry/demo
    tag: 1.12.0-accountingservice
  resources:
    requests:
      cpu: 25m
      memory: 120Mi
    limits:
      cpu: 100m
      memory: 120Mi

