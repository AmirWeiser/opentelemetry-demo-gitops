frontendProxy:
  replicaCount: 1
  image:
    repository: ghcr.io/amirweiser/frontend-proxy
    tag: 5783bb4b3292364dc9d1334ef35a26ce2c51c2d1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    # limits.cpu was 150m, which pegged the container at 100% of its quota
    # even at idle (same hard-CFS-throttle failure mode as the Grafana fix
    # below) and manifested as the UI hanging with "upstream request
    # timeout" - envoy's proxying + OTel tracing overhead needs more burst
    # room than that. memory.limit bumped too: usage was already sitting
    # right at the old 50Mi ceiling.
    limits:
      cpu: 500m
      memory: 128Mi
  ingress:
    # ALB ingress class - only resolves on EKS with the AWS Load Balancer
    # Controller installed. Enabled now that we're targeting EKS; flip back
    # to false for minikube, where it can never get an address and ArgoCD
    # would report it stuck Progressing forever.
    enabled: true
